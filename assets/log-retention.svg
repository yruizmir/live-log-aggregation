<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Inter, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#1c232c"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2c3540" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="960" height="500" rx="10" fill="#11161c"/>

  <text x="40" y="58" font-size="30" font-weight="700" fill="#ffffff">How far back the logs of a container go</text>
  <text x="40" y="94" font-size="20" fill="#9aa7b4">Kubernetes keeps them by size, not by time: 5 files of 10 MB.</text>

  <!-- time axis -->
  <text x="40" y="146" font-size="16" fill="#6f7c89">OLDER</text>
  <text x="920" y="146" font-size="16" fill="#6f7c89" text-anchor="end">NOW</text>
  <line x1="110" y1="141" x2="852" y2="141" stroke="#2f3943" stroke-width="2"/>
  <path d="M852 134l14 7-14 7z" fill="#2f3943"/>

  <!-- files on the node -->
  <g text-anchor="middle">
    <rect x="40"  y="168" width="156" height="72" rx="6" fill="url(#hatch)" stroke="#2c3540"/>
    <rect x="208" y="168" width="156" height="72" rx="6" fill="url(#hatch)" stroke="#2c3540"/>
    <rect x="376" y="168" width="156" height="72" rx="6" fill="url(#hatch)" stroke="#2c3540"/>
    <rect x="544" y="168" width="156" height="72" rx="6" fill="url(#hatch)" stroke="#2c3540"/>
    <rect x="712" y="168" width="208" height="72" rx="6" fill="#0d3a66" stroke="#0093FD" stroke-width="3"/>
    <g font-size="20" fill="#8b97a3">
      <text x="118" y="211">.gz</text><text x="286" y="211">.gz</text><text x="454" y="211">.gz</text><text x="622" y="211">.gz</text>
    </g>
    <text x="816" y="200" font-size="20" font-weight="700" fill="#ffffff">ongoing file</text>
    <text x="816" y="226" font-size="17" fill="#9cc9f5">0 to 10 MB</text>
  </g>

  <!-- brackets -->
  <path d="M40 254v12h660v-12" fill="none" stroke="#3a444f" stroke-width="2"/>
  <text x="370" y="296" font-size="19" font-weight="600" fill="#c9d3dc" text-anchor="middle">Rotated: compressed, out of reach of kubectl</text>
  <text x="370" y="322" font-size="17" fill="#8b97a3" text-anchor="middle">Shaded in the histogram</text>
  <path d="M712 254v12h208v-12" fill="none" stroke="#0093FD" stroke-width="2"/>
  <text x="816" y="296" font-size="19" font-weight="700" fill="#62b1ea" text-anchor="middle">The only one read</text>

  <!-- extras -->
  <rect x="40" y="360" width="430" height="52" rx="6" fill="#3a2a10" stroke="#f5b54a"/>
  <text x="60" y="393" font-size="18" fill="#f5c779"><tspan font-weight="700">Last restart</tspan> · the run before it is kept</text>
  <rect x="490" y="360" width="430" height="52" rx="6" fill="#3a1820" stroke="#e8667a"/>
  <text x="510" y="393" font-size="18" fill="#f19aa8"><tspan font-weight="700">Warning events</tspan> · last hour only</text>

  <text x="40" y="460" font-size="18" fill="#9aa7b4">10 MB lasts days for a quiet container, minutes for a chatty one.</text>
  <text x="40" y="486" font-size="18" fill="#9aa7b4">A deleted or rescheduled pod takes all of its logs with it.</text>
</svg>
